name: Terminal Latency E2E

on:
  pull_request:
    paths:
      - 'src/terminal-local-echo*'
      - 'src/terminal-latency-tracker*'
      - 'src/runtime/terminal-session.ts'
      - 'src/pane-renderer.ts'
      - 'src/runtime/workbench-renderer.ts'
      - 'e2e/tests/terminal-latency.spec.js'
      - 'e2e/helpers/terminal-helpers.js'
      - '.github/workflows/terminal-latency.yml'
  push:
    branches:
      - feat/terminal-local-echo
    paths:
      - 'src/terminal-local-echo*'
      - 'src/terminal-latency-tracker*'
      - 'src/runtime/terminal-session.ts'
      - 'src/pane-renderer.ts'
      - 'src/runtime/workbench-renderer.ts'
      - 'e2e/tests/terminal-latency.spec.js'
      - 'e2e/helpers/terminal-helpers.js'
      - '.github/workflows/terminal-latency.yml'
  workflow_dispatch:

jobs:
  latency-e2e-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb webkit2gtk-driver

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Node modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: |
            node_modules
            e2e/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Cache tauri-driver
        id: cache-td
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}

      - name: Install tauri-driver
        if: steps.cache-td.outputs.cache-hit != 'true'
        run: cargo install tauri-driver

      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install E2E dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build-dev

      - name: Run terminal latency E2E test
        run: npm run test:e2e -- terminal-latency

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: terminal-latency-e2e-artifacts
          path: |
            e2e/screenshots/
          if-no-files-found: ignore
